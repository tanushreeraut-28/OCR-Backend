server.port=${PORT:8080}
server.address=0.0.0.0

# ===============================
# RAILWAY MYSQL DATABASE
# ===============================
# RAILWAY MYSQL DATABASE
# ===============================
spring.datasource.url=jdbc:mysql://${MYSQLHOST:switchback.proxy.rlwy.net}:${MYSQLPORT:25102}/${MYSQLDATABASE:railway}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:epgRivakyHpHsEpGzfiWvFzWzesrqHfw}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

